worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;

  server {
    listen 8080;
    server_name _;

    root /app/frontend/dist;
    index index.html;

    # Backend routes are not namespaced under /api (see backend/main.py) — proxy
    # each exact route the frontend calls (frontend/src/api.js).
    location ~ ^/(health|stats|search|search/facets|compare|hybrid|hybrid-native|agent|analytics|similar|reviews-rag)$ {
      proxy_pass http://127.0.0.1:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_read_timeout 120s;  # agent/reviews-rag calls the LLM
    }

    location /assets/ {
      try_files $uri =404;
      expires 7d;
      add_header Cache-Control "public, immutable";
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
